<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plants</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <nav class="nav container">
        <a href="#" class="logo">GREENMIND</a>

        <ul class="nav-links">
          <li><a href="#home" class="active">Home</a></li>
          <li><a href="#products">Products</a></li>
          <li><a href="#contact">Contacts</a></li>
        </ul>

        <div class="nav-icons">
          <a href="#products" aria-label="Cart">
            <img src="./Vector.png" alt="Cart" />
          </a>
          <a href="#contact" aria-label="Profile">
            <img src="./Vector (2).svg" alt="Profile" />
          </a>
          <span class="icon-divider"></span>
          <button class="menu-button" aria-label="Open menu">☰</button>
        </div>
      </nav>
    </header>

    <!-- HERO -->
    <main>
      <section class="hero container" id="home">
        <div class="hero-content">
          <h1>Buy your<br />dream plants</h1>

          <div class="hero-stats">
            <div class="stat">
              <h2>50+</h2>
              <p>Plant Species</p>
            </div>

            <div class="stat stat-second">
              <h2>100+</h2>
              <p>Customers</p>
            </div>
          </div>

          <form class="search-box" id="searchForm">
            <input
              type="search"
              id="plantSearch"
              placeholder="What are you looking for?"
              aria-label="Search plants"
            />
            <button type="submit" aria-label="Search">
              <span>⌕</span>
            </button>
          </form>
        </div>

        <div class="hero-visual">
          <div class="plant-arch"></div>

          <img class="hero-plant" src="./hero.png" alt="Green plant in a pot" />

          <img src="./strelka.png" alt="strelka" />
          <img src="./strelka2.png" alt="strelka" />
        </div>
      </section>
      <section class="best">
        <div class="best__contenier">
          <div class="best__wrapper">
            <div class="best__info">
              <h3>Best Selling <br />Plants</h3>
              <p class="text">
                Easiest way to <br />
                healthy life by buying <br />
                your favorite plants
              </p>
              <button class="btn">See more →</button>
            </div>
          </div>
          <div class="card">
            <img class="crt" src="./card1.png" alt="card1" />
            <h4 class="title">Natural Plants</h4>
            <span class="money">₱ 1,400.00</span>
          </div>
          <div class="card">
            <img class="crt" src="./card2.png" alt="card1" />
            <h4 class="title">Artificial Plants</h4>
            <span class="money">₱ 900.00</span>
          </div>
          <div class="card">
            <img class="crt" src="./card3.png" alt="card1" />
            <h4 class="title">Artificial Plants</h4>
            <span class="money">₱ 3,500.00</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
